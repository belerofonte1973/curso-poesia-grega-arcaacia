<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="50%" style="stop-color:#c9956a"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>
  
  <!-- Coroa de louros -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
    <!-- Esquerda -->
    <path d="M 35 70 Q 25 55 35 45 Q 45 35 40 25"/>
    <path d="M 40 75 Q 28 62 38 50 Q 48 40 42 30"/>
    <path d="M 47 80 Q 34 68 44 56 Q 54 46 48 36"/>
    <path d="M 55 85 Q 42 74 50 62 Q 60 52 54 42"/>
    <path d="M 65 88 Q 52 78 58 68 Q 66 58 62 50"/>
    <!-- Direita -->
    <path d="M 165 70 Q 175 55 165 45 Q 155 35 160 25"/>
    <path d="M 160 75 Q 172 62 162 50 Q 152 40 158 30"/>
    <path d="M 153 80 Q 166 68 156 56 Q 146 46 152 36"/>
    <path d="M 145 85 Q 158 74 150 62 Q 140 52 146 42"/>
    <path d="M 135 88 Q 148 78 142 68 Q 134 58 138 50"/>
  </g>
  
  <!-- Kithara simplificada -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corpo -->
    <ellipse cx="100" cy="130" rx="30" ry="25"/>
    <!-- Braços -->
    <line x1="85" y1="105" x2="85" y2="60"/>
    <line x1="115" y1="105" x2="115" y2="60"/>
    <!-- Travessa -->
    <line x1="85" y1="60" x2="115" y2="60"/>
    <!-- Cordas -->
    <line x1="90" y1="62" x2="90" y2="130"/>
    <line x1="95" y1="62" x2="95" y2="130"/>
    <line x1="100" y1="62" x2="100" y2="130"/>
    <line x1="105" y1="62" x2="105" y2="130"/>
    <line x1="110" y1="62" x2="110" y2="130"/>
  </g>
  
  <!-- Letra grega psi (ψ) -->
  <text x="100" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="url(#gold)" font-weight="bold">ψ</text>
</svg>
